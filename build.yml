name: Build mod

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gradle 8.8 (bez potrzeby gradlew)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Zbuduj moda
        run: gradle build --no-daemon

      - name: Zapisz jar jako artefakt
        uses: actions/upload-artifact@v4
        with:
          name: PlayerTracker-mod
          path: build/libs/*.jar

      - name: Release (tylko dla tagów v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
